name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            talks/openai-hf/package-lock.json

      - run: npm ci

      # Chromium is only for PDF export, not for the build.
      - run: npm ci --prefix talks/openai-hf
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # Astro to dist/, then Slidev to dist/talks/openai-hf/ (base set in talks/openai-hf/package.json).
      - run: npm run build:all

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
